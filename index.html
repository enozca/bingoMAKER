<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>bingoMAKER</title>
  
  <!-- Fontes Profissionais: Space Grotesk (Títulos) e Inter (Interface e Células) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #090a0f;
      --bg-card: #11131a;
      --bg-cell: #171a24;
      --border-cell: #262a38;
      --text-cell: #d1d5db;
      --accent: #e63946;
      --marked-bg: #80121d;
      --marked-text: #ffffff;
      --font-title: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px 12px;
      transition: background-color 0.2s ease;
    }

    /* Barra Superior Minimalista */
    .toolbar-container {
      position: relative;
      margin-bottom: 20px;
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: center;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: rgba(18, 20, 29, 0.95);
      backdrop-filter: blur(12px);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid #232736;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      flex-wrap: wrap;
      width: 100%;
    }

    .toolbar button {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 10px 12px;
      min-height: 40px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .toolbar button:hover, .toolbar button:active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .toolbar button.active {
      background: var(--accent);
      color: #ffffff;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: #232736;
      margin: 0 2px;
    }

    /* Painel Popover de Cores */
    .color-panel {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #151822;
      border: 1px solid #282d3e;
      border-radius: 14px;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 90%;
      max-width: 300px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
      z-index: 100;
    }

    .color-panel.open {
      display: flex;
    }

    .color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 500;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .color-row input[type="color"] {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid #333a4d;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    .color-row input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    .color-row input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 7px;
    }

    /* Cartela de Bingo */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-cell);
      border-radius: 20px;
      padding: 20px 16px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
      text-align: center;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .title {
      font-family: var(--font-title);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 2px;
      outline: none;
      line-height: 1.15;
      word-break: break-word;
    }

    .subtitle {
      font-size: 0.75rem;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
      outline: none;
    }

    /* Grade */
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      aspect-ratio: 1 / 1;
      width: 100%;
    }

    .grid.grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    /* Células */
    .cell {
      background-color: var(--bg-cell);
      border: 1px solid var(--border-cell);
      border-radius: 8px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 0.68rem;
      font-weight: 500;
      line-height: 1.25;
      color: var(--text-cell);
      outline: none;
      user-select: none;
      cursor: pointer;
      position: relative;
      word-break: break-word;
      hyphens: auto;
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Modo Jogo */
    body.mode-play .cell:active {
      transform: scale(0.96);
    }

    .cell.marked {
      background-color: var(--marked-bg) !important;
      border-color: rgba(255, 255, 255, 0.3) !important;
      color: var(--marked-text) !important;
      font-weight: 600;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.45);
    }

    .cell.marked::after {
      content: "";
      position: absolute;
      top: 4px;
      right: 4px;
      width: 5px;
      height: 5px;
      background-color: #ffffff;
      border-radius: 50%;
      opacity: 0.8;
    }

    /* Modo Edição */
    body.mode-edit .cell {
      cursor: text;
      user-select: text;
    }

    body.mode-edit .cell:focus {
      border-color: var(--accent);
      background-color: rgba(255, 255, 255, 0.05);
    }

    /* Media Queries para Telas Maiores (Desktop / Tablet Grandes) */
    @media (min-width: 480px) {
      body {
        padding: 32px 16px;
        justify-content: center;
      }
      .card {
        padding: 32px;
      }
      .title {
        font-size: 2.1rem;
      }
      .subtitle {
        font-size: 0.78rem;
        margin-bottom: 24px;
      }
      .grid {
        gap: 10px;
      }
      .cell {
        font-size: 0.77rem;
        padding: 8px;
        border-radius: 10px;
      }
      .toolbar {
        width: auto;
      }
    }
  </style>
</head>
<body class="mode-play">

  <div class="toolbar-container">
    <div class="toolbar">
      <button id="btnPlay" class="active" onclick="setMode('play')">Marcar</button>
      <button id="btnEdit" onclick="setMode('edit')">Editar</button>
      <div class="divider"></div>
      <button id="btnSize" onclick="toggleGridSize()">4x4</button>
      <button id="btnColor" onclick="toggleColorPanel()">Cores</button>
      <div class="divider"></div>
      <button onclick="clearMarks()">Limpar</button>
    </div>

    <!-- Dropdown para personalização de cores -->
    <div class="color-panel" id="colorPanel">
      <div class="color-row">
        <span>Destaque / Título</span>
        <input type="color" id="pickerAccent" value="#e63946">
      </div>
      <div class="color-row">
        <span>Fundo Geral</span>
        <input type="color" id="pickerBgPage" value="#090a0f">
      </div>
      <div class="color-row">
        <span>Fundo Cartela</span>
        <input type="color" id="pickerBgCard" value="#11131a">
      </div>
      <div class="color-row">
        <span>Célula</span>
        <input type="color" id="pickerBgCell" value="#171a24">
      </div>
      <div class="color-row">
        <span>Célula Marcada</span>
        <input type="color" id="pickerMarked" value="#80121d">
      </div>
      <div class="color-row">
        <span>Borda</span>
        <input type="color" id="pickerBorder" value="#262a38">
      </div>
      <div class="color-row">
        <span>Texto</span>
        <input type="color" id="pickerText" value="#d1d5db">
      </div>
    </div>
  </div>

  <!-- Cartela -->
  <div class="card">
    <h1 class="title" id="bingoTitle" contenteditable="true" spellcheck="false">HECABINGO</h1>
    <p class="subtitle" id="bingoSubtitle" contenteditable="true" spellcheck="false">previsões</p>

    <div class="grid" id="bingoGrid"></div>
  </div>

  <script>
    const defaultTexts = [
      "Inimigo causa crítico", "Revelação sobre o passado", "NPC importante morre", "Enigma decifrado", "Fuga desesperada",
      "Grupo entra em área proibida", "Frase de efeito memorável", "Perseguição tensa", "Personagem perde sanidade", "Erro crasso de estratégia",
      "Trilha sonora atinge o clímax", "Sacrifício inesperado", "Suspeita de traição", "Segredo revelado", "Item amaldiçoado usado",
      "Aliança inesperada", "Presença de criatura colossal", "Reviravolta de roteiro", "Vitória no último turno", "Cenário destruído",
      "Alguém fica inconsciente", "Teoria confirmada", "Morte de protagonista", "Decisão moral difícil", "Confronto direto inevitável"
    ];

    let currentSize = 5;
    let mode = 'play';

    // Funções de salvamento e carregamento via localStorage
    function saveData() {
      const data = {
        title: document.getElementById('bingoTitle').innerText,
        subtitle: document.getElementById('bingoSubtitle').innerText,
        size: currentSize,
        cells: [],
        colors: {
          accent: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(),
          bgPage: getComputedStyle(document.documentElement).getPropertyValue('--bg-page').trim(),
          bgCard: getComputedStyle(document.documentElement).getPropertyValue('--bg-card').trim(),
          bgCell: getComputedStyle(document.documentElement).getPropertyValue('--bg-cell').trim(),
          marked: getComputedStyle(document.documentElement).getPropertyValue('--marked-bg').trim(),
          border: getComputedStyle(document.documentElement).getPropertyValue('--border-cell').trim(),
          text: getComputedStyle(document.documentElement).getPropertyValue('--text-cell').trim(),
        }
      };

      document.querySelectorAll('.cell').forEach(cell => {
        data.cells.push({
          text: cell.innerText,
          marked: cell.classList.contains('marked')
        });
      });

      localStorage.setItem('bingoMakerData', JSON.stringify(data));
    }

    function loadData() {
      const saved = localStorage.getItem('bingoMakerData');
      if (!saved) return false;

      try {
        const data = JSON.parse(saved);
        currentSize = data.size || 5;
        document.getElementById('btnSize').innerText = currentSize === 5 ? '4x4' : '5x5';
        
        if (data.title) document.getElementById('bingoTitle').innerText = data.title;
        if (data.subtitle) document.getElementById('bingoSubtitle').innerText = data.subtitle;

        // Restaurar cores
        if (data.colors) {
          const setVar = (varName, val, pickerId) => {
            if (val) {
              document.documentElement.style.setProperty(varName, val);
              const picker = document.getElementById(pickerId);
              if (picker) picker.value = val;
            }
          };
          setVar('--accent', data.colors.accent, 'pickerAccent');
          setVar('--bg-page', data.colors.bgPage, 'pickerBgPage');
          setVar('--bg-card', data.colors.bgCard, 'pickerBgCard');
          setVar('--bg-cell', data.colors.bgCell, 'pickerBgCell');
          setVar('--marked-bg', data.colors.marked, 'pickerMarked');
          setVar('--border-cell', data.colors.border, 'pickerBorder');
          setVar('--text-cell', data.colors.text, 'pickerText');
        }

        renderGrid(data.cells);
        return true;
      } catch (e) {
        console.error("Erro ao carregar dados salvos:", e);
        return false;
      }
    }

    function renderGrid(savedCells = null) {
      const grid = document.getElementById('bingoGrid');
      grid.innerHTML = '';
      grid.className = currentSize === 4 ? 'grid grid-4' : 'grid';

      const total = currentSize * currentSize;
      for (let i = 0; i < total; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        
        if (mode === 'edit') {
          cell.contentEditable = "true";
          cell.removeAttribute("inputmode");
        } else {
          cell.contentEditable = "false";
          cell.setAttribute("inputmode", "none");
        }
        
        cell.spellcheck = false;

        // Recuperar texto e marcação salvos ou usar padrão
        if (savedCells && savedCells[i]) {
          cell.innerText = savedCells[i].text;
          if (savedCells[i].marked) {
            cell.classList.add('marked');
          }
        } else {
          cell.innerText = defaultTexts[i] || `Previsão ${i + 1}`;
        }

        // Evento de clique para marcar/desmarcar no modo de jogo
        cell.addEventListener('click', () => {
          if (mode === 'play') {
            cell.classList.toggle('marked');
            saveData();
          }
        });

        // Evento para salvar alterações de texto em tempo real
        cell.addEventListener('input', () => {
          saveData();
        });

        grid.appendChild(cell);
      }
    }

    function setMode(newMode) {
      mode = newMode;
      document.body.className = mode === 'play' ? 'mode-play' : 'mode-edit';
      document.getElementById('btnPlay').classList.toggle('active', mode === 'play');
      document.getElementById('btnEdit').classList.toggle('active', mode === 'edit');

      document.querySelectorAll('.cell').forEach(cell => {
        if (mode === 'edit') {
          cell.contentEditable = "true";
          cell.removeAttribute("inputmode");
        } else {
          cell.contentEditable = "false";
          cell.setAttribute("inputmode", "none");
        }
      });
    }

    function toggleGridSize() {
      currentSize = currentSize === 5 ? 4 : 5;
      document.getElementById('btnSize').innerText = currentSize === 5 ? '4x4' : '5x5';
      renderGrid();
      saveData();
    }

    function clearMarks() {
      document.querySelectorAll('.cell.marked').forEach(c => c.classList.remove('marked'));
      saveData();
    }

    // Gerenciador de cores
    function toggleColorPanel() {
      const panel = document.getElementById('colorPanel');
      panel.classList.toggle('open');
    }

    function setupColorPickers() {
      const bind = (id, variable) => {
        const el = document.getElementById(id);
        el.addEventListener('input', (e) => {
          document.documentElement.style.setProperty(variable, e.target.value);
          saveData();
        });
      };

      bind('pickerAccent', '--accent');
      bind('pickerBgPage', '--bg-page');
      bind('pickerBgCard', '--bg-card');
      bind('pickerBgCell', '--bg-cell');
      bind('pickerMarked', '--marked-bg');
      bind('pickerBorder', '--border-cell');
      bind('pickerText', '--text-cell');

      // Fechar o menu de cores ao clicar fora dele
      document.addEventListener('click', (e) => {
        const panel = document.getElementById('colorPanel');
        const btn = document.getElementById('btnColor');
        if (!panel.contains(e.target) && !btn.contains(e.target)) {
          panel.classList.remove('open');
        }
      });
    }

    // Ouvintes para salvar alterações de título e subtítulo
    document.getElementById('bingoTitle').addEventListener('input', saveData);
    document.getElementById('bingoSubtitle').addEventListener('input', saveData);

    setupColorPickers();

    // Inicialização: Tenta carregar dados salvos; se não houver, renderiza padrão
    if (!loadData()) {
      renderGrid();
    }
  </script>
</body>
</html>
