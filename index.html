<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bingoMAKER</title>
  
  <!-- Fontes Profissionais: Space Grotesk (Títulos) e Inter (Interface e Células) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #090a0f;
      --bg-card: #11131a;
      --bg-cell: #171a24;
      --border-cell: #262a38;
      --text-cell: #d1d5db;
      --accent: #e63946;
      --marked-bg: #80121d;
      --marked-text: #ffffff;
      --font-title: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-page);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      transition: background-color 0.2s ease;
    }

    /* Barra Superior Minimalista */
    .toolbar-container {
      position: relative;
      margin-bottom: 24px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(18, 20, 29, 0.85);
      backdrop-filter: blur(12px);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #232736;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .toolbar button {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: all 0.15s ease;
    }

    .toolbar button:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .toolbar button.active {
      background: var(--accent);
      color: #ffffff;
    }

    .divider {
      width: 1px;
      height: 18px;
      background: #232736;
      margin: 0 2px;
    }

    /* Painel Popover de Cores */
    .color-panel {
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: #151822;
      border: 1px solid #282d3e;
      border-radius: 12px;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 270px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      z-index: 100;
    }

    .color-panel.open {
      display: flex;
    }

    .color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 500;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .color-row input[type="color"] {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid #333a4d;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    .color-row input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    .color-row input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 5px;
    }

    /* Cartela de Bingo */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-cell);
      border-radius: 20px;
      padding: 36px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
      text-align: center;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .title {
      font-family: var(--font-title);
      font-size: 2.1rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
      outline: none;
      line-height: 1.15;
    }

    .subtitle {
      font-size: 0.78rem;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 24px;
      outline: none;
    }

    /* Grade */
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      aspect-ratio: 1 / 1;
      width: 100%;
    }

    .grid.grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    /* Células */
    .cell {
      background-color: var(--bg-cell);
      border: 1px solid var(--border-cell);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 0.77rem;
      font-weight: 500;
      line-height: 1.35;
      color: var(--text-cell);
      outline: none;
      user-select: none;
      cursor: pointer;
      position: relative;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Modo Jogo */
    body.mode-play .cell:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .cell.marked {
      background-color: var(--marked-bg) !important;
      border-color: rgba(255, 255, 255, 0.3) !important;
      color: var(--marked-text) !important;
      font-weight: 600;
      box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.45);
    }

    .cell.marked::after {
      content: "";
      position: absolute;
      top: 6px;
      right: 6px;
      width: 5px;
      height: 5px;
      background-color: #ffffff;
      border-radius: 50%;
      opacity: 0.8;
    }

    /* Modo Edição */
    body.mode-edit .cell {
      cursor: text;
      user-select: text;
    }

    body.mode-edit .cell:focus {
      border-color: var(--accent);
      background-color: rgba(255, 255, 255, 0.04);
    }

    @media (max-width: 600px) {
      .card { padding: 20px; }
      .cell { font-size: 0.65rem; padding: 6px; border-radius: 6px; }
      .title { font-size: 1.6rem; }
    }
  </style>
</head>
<body class="mode-play">

  <div class="toolbar-container">
    <div class="toolbar">
      <button id="btnPlay" class="active" onclick="setMode('play')">Marcar</button>
      <button id="btnEdit" onclick="setMode('edit')">Editar</button>
      <div class="divider"></div>
      <button id="btnSize" onclick="toggleGridSize()">4x4</button>
      <button id="btnColor" onclick="toggleColorPanel()">Cores</button>
      <div class="divider"></div>
      <button onclick="clearMarks()">Limpar</button>
    </div>

    <!-- Dropdown minimalista para personalização de cores -->
    <div class="color-panel" id="colorPanel">
      <div class="color-row">
        <span>Destaque / Título</span>
        <input type="color" id="pickerAccent" value="#e63946">
      </div>
      <div class="color-row">
        <span>Fundo Geral</span>
        <input type="color" id="pickerBgPage" value="#090a0f">
      </div>
      <div class="color-row">
        <span>Fundo Cartela</span>
        <input type="color" id="pickerBgCard" value="#11131a">
      </div>
      <div class="color-row">
        <span>Célula</span>
        <input type="color" id="pickerBgCell" value="#171a24">
      </div>
      <div class="color-row">
        <span>Célula Marcada</span>
        <input type="color" id="pickerMarked" value="#80121d">
      </div>
      <div class="color-row">
        <span>Borda</span>
        <input type="color" id="pickerBorder" value="#262a38">
      </div>
      <div class="color-row">
        <span>Texto</span>
        <input type="color" id="pickerText" value="#d1d5db">
      </div>
    </div>
  </div>

  <!-- Cartela -->
  <div class="card">
    <h1 class="title" contenteditable="true" spellcheck="false">HEXABINGO</h1>
    <p class="subtitle" contenteditable="true" spellcheck="false">Previsões da Sessão</p>

    <div class="grid" id="bingoGrid"></div>
  </div>

  <script>
    const defaultTexts = [
      "Inimigo causa crítico", "Revelação sobre o passado", "NPC importante morre", "Enigma decifrado", "Fuga desesperada",
      "Grupo entra em área proibida", "Frase de efeito memorável", "Perseguição tensa", "Personagem perde sanidade", "Erro crasso de estratégia",
      "Trilha sonora atinge o clímax", "Sacrifício inesperado", "Suspeita de traição", "Segredo revelado", "Item amaldiçoado usado",
      "Aliança inesperada", "Presença de criatura colossal", "Reviravolta de roteiro", "Vitória no último turno", "Cenário destruído",
      "Alguém fica inconsciente", "Teoria confirmada", "Morte de protagonista", "Decisão moral difícil", "Confronto direto inevitável"
    ];

    let currentSize = 5;
    let mode = 'play';

    function renderGrid() {
      const grid = document.getElementById('bingoGrid');
      grid.innerHTML = '';
      grid.className = currentSize === 4 ? 'grid grid-4' : 'grid';

      const total = currentSize * currentSize;
      for (let i = 0; i < total; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.contentEditable = (mode === 'edit');
        cell.spellcheck = false;
        cell.innerText = defaultTexts[i] || `Previsão ${i + 1}`;

        cell.addEventListener('click', () => {
          if (mode === 'play') {
            cell.classList.toggle('marked');
          }
        });

        grid.appendChild(cell);
      }
    }

    function setMode(newMode) {
      mode = newMode;
      document.body.className = mode === 'play' ? 'mode-play' : 'mode-edit';
      document.getElementById('btnPlay').classList.toggle('active', mode === 'play');
      document.getElementById('btnEdit').classList.toggle('active', mode === 'edit');

      document.querySelectorAll('.cell').forEach(cell => {
        cell.contentEditable = (mode === 'edit');
      });
    }

    function toggleGridSize() {
      currentSize = currentSize === 5 ? 4 : 5;
      document.getElementById('btnSize').innerText = currentSize === 5 ? '4x4' : '5x5';
      renderGrid();
    }

    function clearMarks() {
      document.querySelectorAll('.cell.marked').forEach(c => c.classList.remove('marked'));
    }

    // Gerenciador de cores
    function toggleColorPanel() {
      const panel = document.getElementById('colorPanel');
      panel.classList.toggle('open');
    }

    function setupColorPickers() {
      const bind = (id, variable) => {
        const el = document.getElementById(id);
        el.addEventListener('input', (e) => {
          document.documentElement.style.setProperty(variable, e.target.value);
        });
      };

      bind('pickerAccent', '--accent');
      bind('pickerBgPage', '--bg-page');
      bind('pickerBgCard', '--bg-card');
      bind('pickerBgCell', '--bg-cell');
      bind('pickerMarked', '--marked-bg');
      bind('pickerBorder', '--border-cell');
      bind('pickerText', '--text-cell');

      // Fecha o menu de cores ao clicar fora dele
      document.addEventListener('click', (e) => {
        const panel = document.getElementById('colorPanel');
        const btn = document.getElementById('btnColor');
        if (!panel.contains(e.target) && !btn.contains(e.target)) {
          panel.classList.remove('open');
        }
      });
    }

    setupColorPickers();
    renderGrid();
  </script>
</body>
</html>
